name: Android APK (Redmi 9A • ARMv7 32-bit)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS API origin embedded in this testing APK
        required: true
        type: string

permissions:
  contents: write

jobs:
  android-apk:
    name: Build Redmi 9A ARMv7 debug APK
    runs-on: ubuntu-latest
    env:
      EXPO_ANDROID_ABI_PROFILE: armeabi-v7a
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Validate API URL
        run: |
          node - <<'NODE'
          const value = process.env.EXPO_PUBLIC_API_BASE_URL;
          let url;
          try { url = new URL(value); } catch { throw new Error("api_base_url must be a valid URL"); }
          if (url.protocol !== "https:" || url.username || url.password) {
            throw new Error("api_base_url must use HTTPS and contain no credentials");
          }
          console.log(`Using HTTPS API origin: ${url.origin}`);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify icon and 32-bit-only ABI configuration
        run: |
          grep -Fqx 'reactNativeArchitectures=armeabi-v7a' android/gradle.properties
          if grep -Eq '^reactNativeArchitectures=.*(arm64-v8a|x86_64|x86)' android/gradle.properties; then
            echo 'Unexpected non-32-bit ABI found in Gradle configuration.' >&2
            exit 1
          fi
          find android/app/src/main/res -type f -iname '*launcher*' | grep -q .

      - name: Build self-contained ARMv7 APK (debug-signed release variant)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify standalone APK contains only armeabi-v7a
        run: |
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          JS_BYTES=$(unzip -p "$APK" assets/index.android.bundle | wc -c)
          test "$JS_BYTES" -gt 0
          echo "Embedded JavaScript bundle: ${JS_BYTES} bytes"
          ABI_LIST="$(unzip -Z1 "$APK" | awk -F/ '$1=="lib" && NF>=3 {print $2}' | sort -u)"
          printf 'Native ABIs in APK:\n%s\n' "$ABI_LIST"
          test "$ABI_LIST" = 'armeabi-v7a'
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK='android/app/build/outputs/apk/release/app-release.apk'
          RELEASE_APK="$RUNNER_TEMP/GI-APK-Creator-Redmi9A-ARMv7-32bit-debug.apk"
          cp "$APK" "$RELEASE_APK"
          TAG="v1.0.0-redmi9a-armv7.${GITHUB_RUN_NUMBER}"
          NOTES=$(cat <<EOF
          Redmi 9A testing build generated by GitHub Actions run ${GITHUB_RUN_ID}.

          - Android ABI: armeabi-v7a only (32-bit ARM).
          - Signing: debug/test signing; not a Play Store release.
          - The app is configured with the Preview API origin supplied to this workflow; that endpoint is temporary.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "G.I APK Creator — Redmi 9A ARMv7 (build ${GITHUB_RUN_NUMBER})" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: giapkcreator-redmi9a-armeabi-v7a-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
